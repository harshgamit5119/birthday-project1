<!DOCTYPE html>
<html lang="en">

<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DNCYELG2BW"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temporarily Closed</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{

margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

font-family:'Poppins',sans-serif;

background:
linear-gradient(135deg,#232d45,#1f2940);

color:white;

text-align:center;
}

/* BACKGROUND GLOWS */

.bg-glow{

position:fixed;

width:350px;
height:350px;

border-radius:50%;

filter:blur(90px);

opacity:.35;

z-index:-1;

animation:floatGlow 8s ease-in-out infinite;
}

.glow1{

background:#2563eb;

top:-100px;
left:-100px;
}

.glow2{

background:#7c3aed;

bottom:-100px;
right:-100px;

animation-delay:4s;
}

@keyframes floatGlow{

0%{
transform:translateY(0);
}

50%{
transform:translateY(35px);
}

100%{
transform:translateY(0);
}
}

/* MAIN CARD */

.closed-card{

width:85%;
max-width:800px;

padding:50px;

border-radius:35px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(25px);

box-shadow:
0 10px 40px rgba(0,0,0,.35),
0 0 60px rgba(59,130,246,.15);

animation:fadeIn 1.2s ease;
}

h1{

font-size:72px;

margin:0;

font-weight:700;

letter-spacing:4px;

text-shadow:
0 0 30px rgba(59,130,246,.45);
}

.drop-title{

display:flex;

justify-content:center;

flex-wrap:wrap;

gap:6px;

font-size:72px;

font-weight:700;

letter-spacing:3px;
}

.drop-title span{

display:inline-block;

opacity:0;

transform:translateY(-300px);

animation:dropLetter .8s forwards;
}

/* delay each letter */

.drop-title span:nth-child(1){animation-delay:.1s;}
.drop-title span:nth-child(2){animation-delay:.2s;}
.drop-title span:nth-child(3){animation-delay:.3s;}
.drop-title span:nth-child(4){animation-delay:.4s;}
.drop-title span:nth-child(6){animation-delay:.6s;}
.drop-title span:nth-child(7){animation-delay:.7s;}
.drop-title span:nth-child(8){animation-delay:.8s;}
.drop-title span:nth-child(9){animation-delay:.9s;}
.drop-title span:nth-child(10){animation-delay:1s;}
.drop-title span:nth-child(11){animation-delay:1.1s;}

.space{

width:24px;
}

@keyframes dropLetter{

0%{

opacity:0;

transform:
translateY(-300px)
rotate(-20deg);
}

70%{

transform:
translateY(25px);
}

100%{

opacity:1;

transform:
translateY(0);
}
}

@media(max-width:600px){

.drop-title{

font-size:40px;
}
}

.sub{

margin-top:10px;

font-size:24px;

color:#93c5fd;
}

.message{

margin-top:45px;

font-size:22px;

line-height:1.8;

color:#dbe4f0;
}

.date{

display:block;

margin-top:18px;

font-size:48px;

font-weight:700;

color:white;
}

.contact-card{

margin-top:35px;
}

.whatsapp-btn{

display:inline-block;

padding:15px 28px;

border-radius:999px;

text-decoration:none;

color:white;

font-weight:600;

background:
linear-gradient(135deg,#25D366,#128C7E);

box-shadow:
0 10px 25px rgba(37,211,102,.35);

transition:.3s;
}

.whatsapp-btn:hover{

transform:translateY(-3px);

box-shadow:
0 15px 35px rgba(37,211,102,.45);
}

.small{

margin-top:40px;

font-size:14px;

opacity:.6;
}

@keyframes fadeIn{

from{

opacity:0;
transform:translateY(30px);
}

to{

opacity:1;
transform:translateY(0);
}
}

@media(max-width:600px){

.closed-card{

padding:35px 20px;
}

h1{

font-size:40px;
}

.sub{

font-size:18px;
}

.message{

font-size:18px;
}

.date{

font-size:32px;
}

}

</style>

</head>

<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<div class="closed-card">

<h1 class="drop-title">

<span>S</span>
<span>I</span>
<span>T</span>
<span>E</span>

<span class="space"></span>

<span>C</span>
<span>L</span>
<span>O</span>
<span>S</span>
<span>E</span>
<span>D</span>

</h1>

<div class="sub">
by Harsh
</div>

<div class="message">

This website has been temporarily closed.

It will reopen on

<span class="date">
12 May 2027
</span>

</div>

<div class="contact-card">

<h3>Contact Harsh</h3>

<a
href="https://wa.me/917863028015"
target="_blank"
class="whatsapp-btn">

💬 Message on WhatsApp

</a>

</div>

<div class="small">

Thank you for visiting ✨

</div>

</div>

</body>

</html>
